[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclear-scientific"
version = "0.4.0"
description = "NuClear scientific worker: DICOM parsing, physical geometry verification, and quantitative SUVbw determination"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "NuClear Project Team" }
]
dependencies = [
    "pydicom>=2.4.0",
    "numpy==2.5.3",
    "SimpleITK==2.5.6",
]

[project.scripts]
nuclear-worker = "worker.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]
docs = [
    "pdoc>=14.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dicom*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
# Lint target kept conservative (below the runtime floor) so pyupgrade does not
# rewrite third-party-compatible code; this is not the type-check gate.
line-length = 100
target-version = "py310"

[tool.mypy]
# The declared runtime floor is ``requires-python = ">=3.12"``. mypy targets the
# same version: the installed numpy 2.5.x / SimpleITK 2.5.x stubs use PEP 695
# ``type`` statements that cannot be parsed at a 3.10 target. Strictness is
# unchanged; no project module is exempted.
python_version = "3.12"
strict = true
disallow_untyped_defs = true
